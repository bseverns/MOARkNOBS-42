name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unity tests
        working-directory: firmware
        run: |
          platformio test -e teensy40_unity | tee unity-test.log
      - name: Upload unity test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-logs
          path: firmware/unity-test.log

  system-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/hardware-test')
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run system tests
        working-directory: firmware
        run: |
          platformio test -e teensy40_full_system | tee system-test.log
      - name: Upload system test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-logs
          path: firmware/system-test.log
