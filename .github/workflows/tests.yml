name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache both pip and PlatformIO packages for speed
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/platformio.ini') }}

      # Install a recent PlatformIO Core (needed for test_transport=custom),
      # then any other Python deps you keep in requirements.txt
      - name: Install PlatformIO + deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pio --version


      # Build, flash, and run the Unity suite on real hardware.
      - name: Run Unity tests
        working-directory: firmware
        run: |
          platformio run -t clean
          platformio test -e teensy40_unity -vvv | tee unity-test.log
          # Guard: fail if autogen Serial-based transport sneaks back in
          ! grep -F ".pio/build/teensy40_unity/unity_config/unity_config.cpp" unity-test.log || (echo "Autogen Unity transport detected"; exit 1)

      - name: Upload unity test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-logs
          path: firmware/unity-test.log

  # Optional: keep a system test lane you can trigger manually or on a branch
  system-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/hardware-test')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pio --version
      - name: Run system tests
        working-directory: firmware
        run: |
          platformio run -t clean
          platformio test -e teensy40_full_system -vvv | tee system-test.log
      - name: Upload system test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-logs
          path: firmware/system-test.log
