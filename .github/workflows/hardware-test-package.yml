name: Hardware Test Package

on:
  push:
    paths:
      - ".github/workflows/hardware-test-package.yml"
      - "App/**"
      - "bridge/**"
      - "docs/hardware-test/**"
      - "firmware/**"
      - "hardware/**"
      - "requirements.txt"
      - "test.sh"
      - "tools/**"
      - "README.md"
      - "HARDWARE_TEST_README.md"
  pull_request:
    paths:
      - ".github/workflows/hardware-test-package.yml"
      - "App/**"
      - "bridge/**"
      - "docs/hardware-test/**"
      - "firmware/**"
      - "hardware/**"
      - "requirements.txt"
      - "test.sh"
      - "tools/**"
      - "README.md"
      - "HARDWARE_TEST_README.md"

jobs:
  firmware-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build baseline firmware
        run: pio run -d firmware -e teensy40_main
      - name: Check markdown links
        run: python tools/check_markdown_links.py
      - name: Verify source archive export
        run: python tools/export_hardware_test_source.py --root . --label ci-check --output dist/hardware-test-package.zip

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Run bridge tests
        run: npm --prefix bridge test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install app dependencies
        run: npm --prefix App ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx --prefix App playwright install --with-deps chromium
      - name: Run app tests
        run: npm --prefix App test
