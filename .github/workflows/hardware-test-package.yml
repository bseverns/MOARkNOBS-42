name: Hardware Test Package

on:
  push:
    paths:
      - ".github/workflows/hardware-test-package.yml"
      - "App/**"
      - "bridge/**"
      - "docs/hardware-test/**"
      - "firmware/**"
      - "hardware/**"
      - "requirements.txt"
      - "test.sh"
      - "tools/**"
      - "README.md"
      - "HARDWARE_TEST_README.md"
  pull_request:
    paths:
      - ".github/workflows/hardware-test-package.yml"
      - "App/**"
      - "bridge/**"
      - "docs/hardware-test/**"
      - "firmware/**"
      - "hardware/**"
      - "requirements.txt"
      - "test.sh"
      - "tools/**"
      - "README.md"
      - "HARDWARE_TEST_README.md"

jobs:
  firmware-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build baseline firmware
        run: pio run -d firmware -e teensy40_main
      - name: Compile and link Teensy Unity firmware
        run: pio test -d firmware -e teensy40_unity --without-uploading --without-testing
      - name: Run native firmware seam tests
        run: pio test -d firmware -e native_biquad -vvv
      - name: Check markdown links
        run: python tools/check_markdown_links.py
      - name: Resolve contract ledger base
        id: contract-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
            if [[ "$base" == "$(git rev-parse HEAD)" ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Check documentation and contract ledger
        run: |
          python tools/doctor.py --docs
          python tools/check_contract_ledger.py --root . --base "${{ steps.contract-base.outputs.base }}"
      - name: Verify source archive export
        run: python tools/export_hardware_test_source.py --root . --label ci-check --output dist/hardware-test-package.zip

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Run full bridge CI
        run: npm --prefix bridge run ci

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: App/package-lock.json
      - name: Install app dependencies
        run: npm --prefix App ci --no-audit --no-fund
      - name: Show system Chrome
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            echo "System Chrome not found on runner." >&2
            exit 1
          fi
      - name: Run app tests
        env:
          PLAYWRIGHT_SYSTEM_CHROME: "1"
        run: npm --prefix App run ci
