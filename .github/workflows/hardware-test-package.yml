name: Hardware Test Package

on:
  push:
    paths:
      - ".github/workflows/hardware-test-package.yml"
      - "App/**"
      - "bridge/**"
      - "docs/hardware-test/**"
      - "firmware/**"
      - "hardware/**"
      - "requirements.txt"
      - "test.sh"
      - "tools/**"
      - "README.md"
      - "HARDWARE_TEST_README.md"
  pull_request:
    paths:
      - ".github/workflows/hardware-test-package.yml"
      - "App/**"
      - "bridge/**"
      - "docs/hardware-test/**"
      - "firmware/**"
      - "hardware/**"
      - "requirements.txt"
      - "test.sh"
      - "tools/**"
      - "README.md"
      - "HARDWARE_TEST_README.md"

jobs:
  firmware-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build baseline firmware
        run: pio run -d firmware -e teensy40_main
      - name: Check markdown links
        run: python tools/check_markdown_links.py
      - name: Verify source archive export
        run: python tools/export_hardware_test_source.py --root . --label ci-check --output dist/hardware-test-package.zip

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Run bridge tests
        run: npm --prefix bridge test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: App/package-lock.json
      - name: Install app dependencies
        run: npm --prefix App ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('App/package-lock.json') }}
      - name: Install Playwright system dependencies
        shell: bash
        run: |
          set -euo pipefail
          start_ts=$(date +%s)
          npx --prefix App playwright install-deps chromium
          end_ts=$(date +%s)
          echo "Playwright system dependency install duration: $((end_ts - start_ts))s"
      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${HOME}/.cache/ms-playwright"
          echo "Playwright cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"
          echo "Playwright cache dir: ${cache_dir}"
          if [[ -d "${cache_dir}" ]]; then
            echo "Browsers present before install:"
            ls -la "${cache_dir}" || true
          else
            echo "No cached browsers present before install."
          fi
          start_ts=$(date +%s)
          npx --prefix App playwright install chromium
          end_ts=$(date +%s)
          echo "Playwright install duration: $((end_ts - start_ts))s"
          echo "Browsers present after install:"
          ls -la "${cache_dir}" || true
      - name: Run app tests
        run: npm --prefix App test
