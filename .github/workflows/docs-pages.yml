name: Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "App/README.md"
      - "bridge/README.md"
      - "firmware/README.md"
      - "hardware/CurrentBuild.md"
      - "HARDWARE_TEST_README.md"
      - "docs/contracts.yml"
  pull_request:
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "App/README.md"
      - "bridge/README.md"
      - "firmware/README.md"
      - "hardware/CurrentBuild.md"
      - "HARDWARE_TEST_README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material
      - name: Build docs
        run: mkdocs build --strict
      - name: Resolve contract ledger base
        id: contract-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
            if [[ "$base" == "$(git rev-parse HEAD)" ]]; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Run documentation guards
        run: |
          python tools/doctor.py --docs
          python tools/check_contract_ledger.py --root . --base "${{ steps.contract-base.outputs.base }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
