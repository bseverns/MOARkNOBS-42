name: bridge
# CI for the Node.js bridge; runs whenever bridge code or this workflow changes.

on:
  push:
    paths:  # only trigger when bridge files or this workflow are touched
      - 'bridge/**'
      - '.github/workflows/bridge.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'

jobs:
  test:
    runs-on: ubuntu-latest  # generic runner is plenty
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge  # stay rooted in the bridge dir
    steps:
      - uses: actions/checkout@v4  # grab the repo
      - uses: actions/setup-node@v4  # load Node for npm
        with:
          node-version: 20.x  # LTS swagger
      - run: npm ci  # install exact deps
      - name: CLI coverage
        run: npm run test:cli
      - name: Transport coverage
        run: npm run test:transport
      - name: Browser bridge coverage
        run: npm run test:browser
      - name: Entrypoint smoke checks
        run: npm run smoke
