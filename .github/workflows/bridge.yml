name: bridge
# CI for the Node-based bridge; keeps the JS layer honest.

on:
  push:
    paths:
      - 'bridge/**'                 # only fire when the bridge or this workflow changes
      - '.github/workflows/bridge.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge   # keep all commands scoped to the bridge folder
    steps:
      - uses: actions/checkout@v4   # pull down the repo
      - uses: actions/setup-node@v4 # install a fresh Node toolchain
        with:
          node-version: 20.x        # lock to LTS so the build doesn't drift
      - run: npm ci                 # install deps exactly as package-lock dictates
      - run: npm test               # slam the test suite
