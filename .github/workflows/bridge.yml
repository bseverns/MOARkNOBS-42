name: bridge

on:
  push:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm test
