name: Build Wiki Artifact

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare wiki source
        run: |
          mkdir -p _wiki_site
          rsync -a wiki/ _wiki_site/

          # GitHub Wiki uses Home.md; Jekyll expects index.md for root.
          if [ ! -f _wiki_site/index.md ] && [ -f _wiki_site/Home.md ]; then
            cp _wiki_site/Home.md _wiki_site/index.md
          fi

          # Ensure markdown files are rendered as pages by Jekyll.
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"
            if [ "$first_line" != "---" ]; then
              tmp_file="$(mktemp)"
              printf -- "---\n---\n\n" > "$tmp_file"
              cat "$file" >> "$tmp_file"
              mv "$tmp_file" "$file"
            fi
          done < <(find _wiki_site -type f -name "*.md" -print0)

          cat > _wiki_site/_config.yml <<'EOF'
          title: MOARkNOBS-42 Wiki
          description: Project wiki published from /wiki
          theme: minima
          plugins:
            - jekyll-relative-links
          relative_links:
            enabled: true
            collections: true
          include:
            - "*.md"
          EOF

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _wiki_site
          destination: _site

      - name: Upload wiki artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-site
          path: _site
