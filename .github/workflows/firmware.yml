name: Firmware CI
# Focused workflow for firmware changes only.

on:
  push:
    paths:  # trigger when firmware or this workflow changes
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest  # Linux runner fits
    steps:
      - uses: actions/checkout@v4  # grab code

      - name: Set up Python (and keep it snappy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'  # cache pip packages between runs

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # pulls in PlatformIO

      - name: Cache build mojo
        uses: actions/cache@v4
        with:
          path: firmware/.pio  # store compiled objects
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build firmware
        working-directory: firmware
        run: pio run -e teensy40_main  # compile the main firmware
