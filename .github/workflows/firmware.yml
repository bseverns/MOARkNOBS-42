name: Firmware CI
# Watches firmware changes and makes sure the build still stands.

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # grab the repo contents

      - name: Set up Python (and keep it snappy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'              # cache pip packages for speed

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache build mojo
        uses: actions/cache@v4
        with:
          path: firmware/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build firmware
        working-directory: firmware
        run: pio run -e teensy40_main  # compile the default firmware target
