name: CI
# Full-stack check: builds firmware, tests the bridge, and lints everything.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest  # spin up a Linux runner
    steps:
      - uses: actions/checkout@v3  # pull repo
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  # any recent 3.x is fine
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # grabs PlatformIO and friends
      - name: Build every environment
        working-directory: firmware
        run: >-
          pio run -e teensy40_main -e teensy40_full_system -e teensy40_unified_test -e teensy40_biquad_test -e teensy40_eeprom_persistence -e teensy40_slot_verify  # prove every env compiles


  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge  # keep node commands scoped
    steps:
      - uses: actions/checkout@v3  # grab repo again
      - uses: actions/setup-node@v4  # install Node LTS
        with:
          node-version: 20.x
      - name: Install dependencies
        run: npm ci  # install exact deps
      - name: Bridge CLI coverage
        run: npm run test:cli
      - name: Bridge transport coverage
        run: npm run test:transport
      - name: Bridge browser coverage
        run: npm run test:browser
      - name: Bridge smoke checks
        run: npm run smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      # bring down the latest commit to this funky runner
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit  # brings the style enforcers
      - name: Run pre-commit
        # any hook yelling here will blow up the build
        run: pre-commit run --all-files

  docs-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install docs + validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate docs links + wiki ownership policy
        run: |
          python tools/check_markdown_links.py
          python tools/check_wiki_contract.py
      - name: Validate app/firmware manifest contract sync
        run: python tools/check_contract_sync.py
      - name: Build MkDocs site strictly
        run: mkdocs build --strict
      - name: Upload docs site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site
