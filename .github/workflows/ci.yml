name: CI
# Full pull/push gauntlet: builds firmware, tests the bridge, and lints everything.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3  # pull repo so PlatformIO has something to chew on
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'     # any 3.x works for PlatformIO
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build every environment
        working-directory: firmware
        run: >-
          pio run -e teensy40_main -e teensy40_full_system -e teensy40_unified_test -e teensy40_biquad_test -e teensy40_eeprom_persistence -e teensy40_slot_verify


  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge  # stay inside the JS project
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x        # lock Node to LTS
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      # bring down the latest commit to this funky runner
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        # any hook yelling here will blow up the build
        run: pre-commit run --all-files
