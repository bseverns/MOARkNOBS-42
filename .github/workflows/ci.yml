name: CI
# Builds firmware environments, lints the repo, and validates docs/contracts.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest  # spin up a Linux runner
    steps:
      - uses: actions/checkout@v4  # pull repo
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # grabs PlatformIO and friends
      - name: Build every environment
        working-directory: firmware
        run: >-
          pio run -e teensy40_main -e teensy40_full_system -e teensy40_unified_test -e teensy40_biquad_test -e teensy40_eeprom_persistence -e teensy40_slot_verify  # prove every env compiles

  # Bridge tests removed from this workflow — they run identically in
  # quick-check.yml (every push) and tests.yml (via test.sh).  The
  # dedicated bridge.yml workflow provides fast path-filtered feedback
  # when only bridge/ files change.

  lint:
    runs-on: ubuntu-latest
    steps:
      # bring down the latest commit to this funky runner
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit  # brings the style enforcers
      - name: Run pre-commit
        # any hook yelling here will blow up the build
        run: pre-commit run --all-files

  docs-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install docs + validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate docs links + wiki ownership policy
        run: |
          python tools/check_markdown_links.py
          python tools/check_wiki_contract.py
      - name: Validate app/firmware manifest contract sync
        run: python tools/check_contract_sync.py
      - name: Validate schema keyword coverage against mini-ajv
        run: python tools/check_schema_keyword_coverage.py
      - name: Build MkDocs site strictly
        run: mkdocs build --strict
      - name: Upload docs site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site
