name: Release
# Rebuilds deterministic release artifacts whenever a GitHub release goes live.

on:
  release:
    types: [published]  # only fire after a release is published

jobs:
  software-gates:
    name: software-gates (bridge + app + firmware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO + Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install platformio

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run bridge tests
        run: |
          npm --prefix bridge ci
          npm --prefix bridge test

      - name: Run app tests
        run: |
          npm --prefix App ci --no-audit --no-fund
          npx --prefix App playwright install --with-deps chromium
          npm --prefix App test

      - name: Build firmware (teensy40_main)
        run: pio -d firmware run -e teensy40_main

  package-release:
    name: package-release-artifacts
    runs-on: ubuntu-latest
    needs: software-gates
    steps:
      - uses: actions/checkout@v4  # pull the tagged source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # speed up pip installs

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio  # we just need PIO for the build

      - name: Package release artifacts
        env:
          FW_VERSION: ${{ github.event.release.tag_name }}
          REQUIRE_HIL: "0"
        run: ./release.sh ${{ github.event.release.tag_name }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/mn42_${{ github.event.release.tag_name }}.hex
            dist/hardware_reference.zip
            dist/mn42_${{ github.event.release.tag_name }}_source.zip
            dist/release_verification.json
            dist/manifest.json
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_LICENSES.md
            dist/LICENSES/**
