name: Release
# Kicks off when a GitHub release is published; spits out firmware + sysreport.

on:
  release:
    types: [published]  # only run once the release is officially live

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # snag the source so we can build it

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'             # speed up pip installs

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        working-directory: firmware
        env:
          FW_VERSION: ${{ github.event.release.tag_name }}  # pass tag as version define
        run: pio run -e teensy40_main

      - name: Bake sysreport
        env:
          FW_VERSION: ${{ github.event.release.tag_name }}
        run: |
          python - <<"EOF"  # small inline Python to snapshot build metadata
          import json, os, subprocess, time
          fw = os.environ["FW_VERSION"]
          sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"]).decode().strip()
          info = {
            "fw_version": fw,
            "git_sha": sha,
            "board": "teensy40",
            "mcu": "IMXRT1062",
            "f_cpu_hz": 600000000,
            "build_time": time.strftime("%b %d %Y %H:%M:%S"),
            "compiler": subprocess.check_output(["g++", "--version"]).decode().splitlines()[0],
            "pio_env": "teensy40_main",
          }
          with open("sysreport.json", "w") as f:
            json.dump(info, f)
          EOF

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            firmware/.pio/build/teensy40_main/firmware.hex  # compiled firmware
            sysreport.json                                 # build metadata dump
