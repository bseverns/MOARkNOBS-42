name: Release
# Rebuilds firmware and packages a sysreport whenever a GitHub release goes live.

on:
  release:
    types: [published]  # only fire after a release is published

jobs:
  build:
    runs-on: ubuntu-latest  # standard runner
    steps:
      - uses: actions/checkout@v4  # pull the tagged source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'  # speed up pip installs

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio  # we just need PIO for the build

      - name: Package release artifacts
        run: ./release.sh ${{ github.event.release.tag_name }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/mn42_${{ github.event.release.tag_name }}.hex
            dist/fabrication.zip
            dist/mn42_${{ github.event.release.tag_name }}_source.tar.gz
            dist/manifest.json
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_LICENSES.md
            dist/LICENSES/**
