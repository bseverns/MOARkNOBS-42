name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to current ref/tag)"
        required: false
        type: string

jobs:
  resolve-release-meta:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      artifact_tag: ${{ steps.meta.outputs.artifact_tag }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          input_tag_raw="${{ github.event.inputs.tag || '' }}"
          input_tag="${input_tag_raw#refs/tags/}"
          input_tag="${input_tag#refs/heads/}"
          input_tag="$(echo "${input_tag}" | xargs)"
          if [[ -n "${input_tag}" ]]; then
            release_tag="${input_tag}"
            checkout_ref="${input_tag}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
          else
            release_tag="manual-${GITHUB_SHA:0:7}"
            checkout_ref="${GITHUB_REF}"
          fi
          artifact_tag="$(printf '%s' "${release_tag}" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact_tag=${artifact_tag}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${release_tag}"
          echo "Resolved artifact tag: ${artifact_tag}"
          echo "Resolved checkout ref: ${checkout_ref}"

  firmware-preflight:
    runs-on: ubuntu-latest
    needs: resolve-release-meta
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build baseline firmware
        run: pio run -d firmware -e teensy40_main

  bridge-preflight:
    runs-on: ubuntu-latest
    needs: resolve-release-meta
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Run bridge release preflight
        run: npm --prefix bridge run release:prep

  app-preflight:
    runs-on: ubuntu-latest
    needs: resolve-release-meta
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - name: Install app dependencies
        run: npm --prefix App ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx --prefix App playwright install --with-deps chromium
      - name: Run app tests
        run: npm --prefix App test

  release-artifacts:
    runs-on: ubuntu-latest
    needs:
      - resolve-release-meta
      - firmware-preflight
      - bridge-preflight
      - app-preflight
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Install app dependencies
        run: npm --prefix App ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx --prefix App playwright install --with-deps chromium
      - name: Build release artifacts
        run: |
          FW_VERSION="${RELEASE_TAG}" REQUIRE_HIL=0 ./release.sh "${RELEASE_TAG}"
      - name: Upload release build artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-core-${{ needs.resolve-release-meta.outputs.artifact_tag }}
          path: |
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}.hex
            dist/hardware_reference.zip
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}_source.zip
            dist/release_verification.json
            dist/manifest.json
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_LICENSES.md
            dist/LICENSES
      - name: Check whether GitHub release exists
        id: release-check
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput("exists", "true");
              core.setOutput("release_id", String(release.data.id));
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("exists", "false");
                return;
              }
              throw error;
            }
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
      - name: Upload core release assets when release exists
        if: steps.release-check.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            "dist/mn42_${RELEASE_TAG}.hex" \
            "dist/hardware_reference.zip" \
            "dist/mn42_${RELEASE_TAG}_source.zip" \
            "dist/release_verification.json" \
            "dist/manifest.json" \
            "dist/SHA256SUMS.txt" \
            "dist/THIRD_PARTY_LICENSES.md" \
            --clobber
      - name: Note skipped core release upload
        if: steps.release-check.outputs.exists != 'true'
        run: echo "No GitHub release found for tag '${RELEASE_TAG}'. Core assets kept as workflow artifacts only."

  bridge-package-artifacts:
    needs:
      - resolve-release-meta
      - bridge-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: node22-macos-x64
          - os: macos-latest
            target: node22-macos-arm64
          - os: ubuntu-latest
            target: node22-linux-x64
          - os: windows-latest
            target: node22-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Run bridge release preflight
        run: npm --prefix bridge run release:prep
      - name: Package bridge artifact
        shell: bash
        env:
          TARGETS: ${{ matrix.target }}
          OUTPUT_NAME: mn42-bridge-${{ needs.resolve-release-meta.outputs.artifact_tag }}
        run: npm --prefix bridge run package:bridge
      - name: Collect packaged files and generate checksums
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix="bridge/dist/mn42-bridge-${{ needs.resolve-release-meta.outputs.artifact_tag }}-${{ matrix.target }}"
          files=( "${prefix}"* )
          shopt -u nullglob
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No packaged bridge artifact found for ${prefix}" >&2
            exit 1
          fi
          stage_dir="bridge/dist/release-${{ matrix.target }}"
          mkdir -p "${stage_dir}"
          for file in "${files[@]}"; do
            if [[ -f "${file}" ]]; then
              cp "${file}" "${stage_dir}/"
            fi
          done
          shopt -s nullglob
          staged_files=( "${stage_dir}/mn42-bridge-${{ needs.resolve-release-meta.outputs.artifact_tag }}-${{ matrix.target }}"* )
          shopt -u nullglob
          if [[ ${#staged_files[@]} -eq 0 ]]; then
            echo "No staged bridge artifacts found in ${stage_dir}" >&2
            exit 1
          fi
          checksum_cmd=(python tools/write_checksums.py --output "${stage_dir}/SHA256SUMS-${{ matrix.target }}.txt")
          for staged_file in "${staged_files[@]}"; do
            checksum_cmd+=(--file "${staged_file}")
          done
          "${checksum_cmd[@]}"
      - name: Upload per-target bridge artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: bridge-package-${{ matrix.target }}
          path: bridge/dist/release-${{ matrix.target }}

  bridge-release-upload:
    runs-on: ubuntu-latest
    needs:
      - resolve-release-meta
      - bridge-package-artifacts
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
      ARTIFACT_TAG: ${{ needs.resolve-release-meta.outputs.artifact_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - name: Download packaged bridge artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bridge-package-*
          merge-multiple: true
          path: bridge/dist/release-upload
      - name: Upload combined bridge artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: bridge-release-${{ env.ARTIFACT_TAG }}
          path: |
            bridge/dist/release-upload
            bridge/THIRD_PARTY_LICENSES.md
            bridge/THIRD_PARTY_LICENSES.json
      - name: Check whether GitHub release exists
        id: release-check
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput("exists", "true");
              core.setOutput("release_id", String(release.data.id));
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("exists", "false");
                return;
              }
              throw error;
            }
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
      - name: Upload bridge assets to existing GitHub release
        if: steps.release-check.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            bridge/dist/release-upload/* \
            bridge/THIRD_PARTY_LICENSES.md \
            bridge/THIRD_PARTY_LICENSES.json \
            --clobber
      - name: Note skipped bridge release upload
        if: steps.release-check.outputs.exists != 'true'
        run: echo "No GitHub release found for tag '${RELEASE_TAG}'. Bridge assets kept as workflow artifacts only."
