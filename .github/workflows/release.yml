name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated semantic tag to build (vX.Y.Z)"
        required: true
        type: string

jobs:
  resolve-release-meta:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      artifact_tag: ${{ steps.meta.outputs.artifact_tag }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          input_tag_raw="${{ github.event.inputs.tag || '' }}"
          input_tag="${input_tag_raw#refs/tags/}"
          input_tag="${input_tag#refs/heads/}"
          input_tag="$(echo "${input_tag}" | xargs)"
          if [[ -n "${input_tag}" ]]; then
            release_tag="${input_tag}"
            checkout_ref="${input_tag}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
          else
            echo "Release workflow requires an annotated semantic tag." >&2
            exit 1
          fi
          artifact_tag="$(printf '%s' "${release_tag}" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact_tag=${artifact_tag}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${release_tag}"
          echo "Resolved artifact tag: ${artifact_tag}"
          echo "Resolved checkout ref: ${checkout_ref}"

  release-contract:
    runs-on: ubuntu-latest
    needs: resolve-release-meta
    outputs:
      release_sha: ${{ steps.contract.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
          fetch-depth: 0
      - id: contract
        name: Require semantic annotated tag and changelog entry
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 tools/check_release_tag.py --root . --tag "${RELEASE_TAG}"
          release_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"

  firmware-preflight:
    runs-on: ubuntu-latest
    needs:
      - resolve-release-meta
      - release-contract
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check release checkout/path readiness
        run: python3 tools/check_release_readiness.py --root . --stage hardware-test
      - name: Build baseline firmware
        run: pio run -d firmware -e teensy40_main
      - name: Compile and link Teensy Unity firmware
        run: pio test -d firmware -e teensy40_unity --without-uploading --without-testing
      - name: Run native button interpreter tests
        run: |
          ${CXX:-c++} -std=c++17 -Wall -Wextra -Werror -I firmware/include \
            firmware/src/ButtonGestureInterpreter.cpp tools/button_gesture_interpreter_test.cpp \
            -o /tmp/mn42-button-interpreter
          /tmp/mn42-button-interpreter
      - name: Run native biquad tests
        run: pio test -d firmware -e native_biquad -vvv
      - name: Run native modulation transport tests
        run: pio test -d firmware -e native_transport -vvv
      - name: Run native modulation resolver tests
        run: pio test -d firmware -e native_modulation -vvv
      - name: Run native persistence layout tests
        run: pio test -d firmware -e native_persistence -vvv

  bridge-preflight:
    runs-on: ubuntu-latest
    needs:
      - resolve-release-meta
      - release-contract
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Run bridge release preflight
        run: npm --prefix bridge run release:prep

  app-preflight:
    runs-on: macos-15
    needs:
      - resolve-release-meta
      - release-contract
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: App/package-lock.json
      - name: Install app dependencies
        run: npm --prefix App ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx --prefix App playwright install chromium
      - name: Run app tests
        run: npm --prefix App run ci

  release-artifacts:
    runs-on: ubuntu-latest
    needs:
      - resolve-release-meta
      - firmware-preflight
      - bridge-preflight
      - app-preflight
    env:
      RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: App/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Install app dependencies
        run: npm --prefix App ci --no-audit --no-fund
      - name: Show system Chrome
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            echo "System Chrome not found on runner." >&2
            exit 1
          fi
      - name: Build hardware-test/prerelease artifacts
        env:
          PLAYWRIGHT_SYSTEM_CHROME: "1"
        run: |
          FW_VERSION="${RELEASE_TAG}" REQUIRE_HIL=0 ./release.sh "${RELEASE_TAG}"
      - name: Upload hardware-test core artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: hardware-test-core-${{ needs.resolve-release-meta.outputs.artifact_tag }}
          path: |
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}_hardware-test_firmware.hex
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}_hardware-test_hardware-reference.zip
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}_hardware-test_source.zip
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}_hardware-test_app.zip
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}_hardware-test_verification.json
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}_hardware-test_manifest.json
            dist/mn42_${{ needs.resolve-release-meta.outputs.release_tag }}_hardware-test_SHA256SUMS.txt
            dist/THIRD_PARTY_LICENSES.md
            dist/LICENSES

  bridge-package-artifacts:
    needs:
      - resolve-release-meta
      - release-contract
      - bridge-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: node24-macos-x64
          - os: macos-latest
            target: node24-macos-arm64
          - os: ubuntu-latest
            target: node24-linux-x64
          - os: windows-latest
            target: node24-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install bridge dependencies
        run: npm --prefix bridge ci
      - name: Run bridge release preflight
        run: npm --prefix bridge run release:prep
      - name: Package bridge artifact
        shell: bash
        env:
          TARGETS: ${{ matrix.target }}
          OUTPUT_NAME: mn42-bridge-${{ needs.resolve-release-meta.outputs.artifact_tag }}
        run: npm --prefix bridge run package:bridge
      - name: Collect packaged files and generate checksums
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          prefix="bridge/dist/mn42-bridge-${{ needs.resolve-release-meta.outputs.artifact_tag }}-"
          files=(
            "${prefix}"cli-"${{ matrix.target }}"*
            "${prefix}"console-"${{ matrix.target }}"*
          )
          shopt -u nullglob
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No packaged bridge artifact found for ${prefix}*${{ matrix.target }}" >&2
            exit 1
          fi
          stage_dir="bridge/dist/release-${{ matrix.target }}"
          mkdir -p "${stage_dir}"
          for file in "${files[@]}"; do
            if [[ -f "${file}" ]]; then
              cp "${file}" "${stage_dir}/"
            fi
          done
          shopt -s nullglob
          staged_files=( "${stage_dir}/mn42-bridge-${{ needs.resolve-release-meta.outputs.artifact_tag }}-"*"-${{ matrix.target }}"* )
          shopt -u nullglob
          if [[ ${#staged_files[@]} -eq 0 ]]; then
            echo "No staged bridge artifacts found in ${stage_dir}" >&2
            exit 1
          fi
          checksum_cmd=(python tools/write_checksums.py --output "${stage_dir}/SHA256SUMS-${{ matrix.target }}.txt")
          for staged_file in "${staged_files[@]}"; do
            checksum_cmd+=(--file "${staged_file}")
          done
          "${checksum_cmd[@]}"
          cli_binary=""
          console_binary=""
          for staged_file in "${staged_files[@]}"; do
            case "${staged_file}" in
              *.txt|*.json|*.md) continue ;;
            esac
            if [[ "${staged_file}" == *"-cli-${{ matrix.target }}"* ]]; then
              cli_binary="${staged_file}"
            elif [[ "${staged_file}" == *"-console-${{ matrix.target }}"* ]]; then
              console_binary="${staged_file}"
            fi
          done
          if [[ -z "${cli_binary}" || -z "${console_binary}" ]]; then
            echo "Expected packaged CLI and console bridge binaries in ${stage_dir}" >&2
            exit 1
          fi
          shopt -s nullglob
          unix_binaries=( "${stage_dir}/mn42-bridge-"* )
          shopt -u nullglob
          for candidate in "${unix_binaries[@]}"; do
            case "${candidate}" in
              *.txt|*.json|*.md|*.exe) continue ;;
            esac
            chmod 755 "${candidate}"
          done
          "${cli_binary}" --help >/dev/null
          "${console_binary}" --help >/dev/null
          node bridge/scripts/smoke_packaged_bridge_server.js \
            --binary "${console_binary}"
          printf '%s\n' \
            'MN42 Bridge hardware-test / prerelease unsigned CI artifact' \
            '' \
            'Contents:' \
            '- one platform-specific bridge CLI binary' \
            '- one platform-specific bridge console/server binary' \
            '- SHA256SUMS for this target' \
            '- bundled third-party license notices' \
            '- bridge_artifact_manifest.json' \
            '' \
            'The console binary is the desktop session runtime path.' \
            'The CLI binary preserves the shell-first bridge workflow.' \
            '' \
            'This bundle is intentionally unsigned.' \
            'It is a hardware-test/prerelease artifact, not a signed beta/public installer.' \
            'For install and usage details, see bridge/README.md and docs/release/BridgeSigningPlan.md.' \
            > "${stage_dir}/README.txt"
          cp bridge/THIRD_PARTY_LICENSES.md "${stage_dir}/THIRD_PARTY_LICENSES.md"
          cp bridge/THIRD_PARTY_LICENSES.json "${stage_dir}/THIRD_PARTY_LICENSES.json"
          cp -R bridge/LICENSES "${stage_dir}/LICENSES"
          node bridge/scripts/write_artifact_manifest.js \
            --stage-dir "${stage_dir}" \
            --target "${{ matrix.target }}" \
            --release-tag "${{ needs.resolve-release-meta.outputs.release_tag }}" \
            --commit-sha "${{ needs.release-contract.outputs.release_sha }}" \
            --node-target "${{ matrix.target }}" \
            --signing-status "unsigned-ci-artifact"
      - name: Upload per-target bridge artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: bridge-package-${{ matrix.target }}
          path: bridge/dist/release-${{ matrix.target }}

  bridge-bundle-artifacts:
    runs-on: ubuntu-latest
    needs:
      - resolve-release-meta
      - bridge-package-artifacts
    env:
      RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
      ARTIFACT_TAG: ${{ needs.resolve-release-meta.outputs.artifact_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-meta.outputs.checkout_ref }}
      - name: Download packaged bridge artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bridge-package-*
          path: bridge/dist/release-download
      - name: Archive each platform Bridge bundle without flattening support files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge/dist/release-upload
          for target in node24-macos-x64 node24-macos-arm64 node24-linux-x64 node24-win-x64; do
            source_dir="bridge/dist/release-download/bridge-package-${target}"
            output_file="bridge/dist/release-upload/mn42-bridge-${ARTIFACT_TAG}-${target}-hardware-test.zip"
            python3 tools/archive_release_directory.py \
              --source "${source_dir}" \
              --output "${output_file}" \
              --prefix "mn42-bridge-${ARTIFACT_TAG}-${target}"
          done
      - name: Upload combined hardware-test bridge artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: hardware-test-bridge-${{ env.ARTIFACT_TAG }}
          path: bridge/dist/release-upload

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - resolve-release-meta
      - release-contract
      - release-artifacts
      - bridge-bundle-artifacts
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.release-contract.outputs.release_sha }}
      ARTIFACT_TAG: ${{ needs.resolve-release-meta.outputs.artifact_tag }}
    steps:
      - name: Download hardware-test core artifacts
        uses: actions/download-artifact@v7
        with:
          name: hardware-test-core-${{ env.ARTIFACT_TAG }}
          path: release-assets/core
      - name: Download hardware-test Bridge artifacts
        uses: actions/download-artifact@v7
        with:
          name: hardware-test-bridge-${{ env.ARTIFACT_TAG }}
          path: release-assets/bridge
      - name: Create or update the hardware-test prerelease
        id: release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const markerStart = '<!-- mn42-artifacts:start -->';
            const markerEnd = '<!-- mn42-artifacts:end -->';
            const artifactIndex = `${markerStart}\n## Artifacts\n\nBuilt from \`${sha}\` / tag \`${tag}\`.\n\n` +
              '- Firmware HEX\n' +
              '- Hardware reference bundle\n' +
              '- Tracked-source export\n' +
              '- Frozen browser App bundle\n' +
              '- Bridge packages: macOS arm64, macOS x64, Linux x64, Windows x64\n' +
              '- Verification receipt and provenance manifest\n' +
              '- SHA-256 checksums and third-party license notices\n\n' +
              'All Bridge binaries are unsigned hardware-test/prerelease artifacts. See the verification JSON for checks run versus skipped.\n' +
              markerEnd;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })).data;
              const currentBody = release.body || '';
              const managedBlock = /<!-- mn42-artifacts:start -->[\s\S]*?<!-- mn42-artifacts:end -->/;
              const body = managedBlock.test(currentBody)
                ? currentBody.replace(managedBlock, artifactIndex)
                : `${currentBody}\n\n${artifactIndex}`.trim();
              release = (await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body,
                prerelease: true,
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              const generated = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
              });
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                body: `${generated.data.body || ''}\n\n${artifactIndex}`.trim(),
                draft: false,
                prerelease: true,
              })).data;
            }
            core.setOutput('release_id', String(release.id));
            core.setOutput('html_url', release.html_url);
      - name: Upload the complete labeled release asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_args=()
          for asset in release-assets/core/* release-assets/bridge/*; do
            if [[ ! -f "${asset}" ]]; then
              continue
            fi
            filename="$(basename "${asset}")"
            case "${filename}" in
              *_firmware.hex)
                label="MN42 hardware-test firmware HEX (prototype/prerelease)"
                ;;
              *_hardware-reference.zip)
                label="MN42 hardware-test hardware reference bundle (not fabrication-ready)"
                ;;
              *_source.zip)
                label="MN42 hardware-test tracked-source export"
                ;;
              *_app.zip)
                label="MN42 frozen browser App bundle"
                ;;
              *_verification.json)
                label="MN42 hardware-test verification receipt"
                ;;
              *_manifest.json)
                label="MN42 hardware-test provenance manifest"
                ;;
              *_SHA256SUMS.txt)
                label="MN42 hardware-test core checksums"
                ;;
              mn42-bridge-*-node24-*-hardware-test.zip)
                label="MN42 Bridge platform bundle (${filename}; unsigned hardware-test prerelease)"
                ;;
              SHA256SUMS-*)
                label="MN42 Bridge hardware-test checksums (${filename})"
                ;;
              bridge_artifact_manifest.json)
                label="MN42 Bridge hardware-test artifact manifest"
                ;;
              README.txt)
                label="MN42 Bridge hardware-test prerelease notes"
                ;;
              THIRD_PARTY_LICENSES.*)
                label="MN42 Bridge third-party license notices (${filename})"
                ;;
              *)
                label="MN42 Bridge hardware-test support file (${filename})"
                ;;
            esac
            upload_args+=("${asset}#${label}")
          done
          if [[ ${#upload_args[@]} -eq 0 ]]; then
            echo "No release files found to attach." >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${upload_args[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
      - name: Report published prerelease
        run: echo "Published complete hardware-test prerelease at ${{ steps.release.outputs.html_url }}"
