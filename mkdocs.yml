site_name: MOARkNOBS-42
site_description: Story-first documentation for builders, performers, and curious learners.
site_url: https://bseverns.github.io/MOARkNOBS-42/
repo_url: https://github.com/bseverns/MOARkNOBS-42
repo_name: bseverns/MOARkNOBS-42
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: true
theme:
  name: material
  icon:
    logo: material/tune-variant
  features:
    - announce.dismiss
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Barlow Condensed
    code: JetBrains Mono

extra_css:
  - mkdocs-overrides.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.0/dist/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

not_in_nav: |
  /UI_ACTION_LEDGER.md
  /vscode-intellisense.md
  /Primers/*.md
  /bench/app/*.md
  /bench/bridge/*.md
  /bench/bridge-host-recipes/*.md
  /bench/firmware/*.md
  /bench/latency/*.md
  /bench/noise/*.md
  /app/AppModeAudit.md
  /bridge/BridgeFirstRunAudit.md
  /bridge/BridgeConsoleTour.md
  /examples/max/*.md
  /examples/puredata/*.md
  /firmware/*.md
  /guides/OSCBridge.md
  /guides/OperatorTutorial.md
  /guides/ProtocolWalkthrough.md
  /guides/WebSerial.md
  /hardware-test/PackageManifest.md
  /reference/EF_Frontend_v2.md
  /reference/HardwareSubstitutions.md
  /reference/Options_DNI.md
  /reference/PowerBudget.md
  /reference/assumption-ledger.md
  /release/ReleaseStory.md
  /release/Reproducibility.md
  /release/bridge-artifacts-checklist.md
  /sketch/systemFlow/hw/*.md
  /tools/*report-template.md
  /validation/DemoPolish.md
  /validation/OledDominanceChecklist.md
  /validation/OnDeviceControlCoverage.md
  /validation/Troubleshooting.md
  /validation/reports/*.md

