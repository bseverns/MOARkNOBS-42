# Pre-commit config: keeps the repo from devolving into style chaos.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8  # pinned clang-format for C/C++ sources
    hooks:
      - id: clang-format
        files: ^firmware/.*\.(c|cpp|h|hpp)$  # only format firmware code
        exclude: ^firmware/lib/  # but don't touch vendored libs
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0  # JS lint cops
    hooks:
      - id: eslint
        files: ^bridge/.*\.js$  # watch our bridge JS
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0  # consistent formatting for JS/JSON/MD
    hooks:
      - id: prettier
        files: ^(bridge|App)/.*\.(js|json|md)$|^(docs|wiki)/.*\.md$|^README\.md$|^CONTRIBUTING\.md$  # tidy JS and docs across the stack
  - repo: local
    hooks:
      - id: contract-sync
        name: contract sync guard
        entry: python3 tools/check_contract_sync.py
        language: system
        pass_filenames: false
      - id: schema-keyword-coverage
        name: schema keyword coverage guard
        entry: python3 tools/check_schema_keyword_coverage.py
        language: system
        pass_filenames: false
