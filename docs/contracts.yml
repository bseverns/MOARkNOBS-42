version: 1
contracts:
  app:
    source:
      - App/runtime/**
      - App/views/**
      - App/config_schema.json
    docs:
      - App/README.md
      - docs/reference/ConfigurationTransactionModel.md
      - docs/app/AppTransportTruthTable.md
      - docs/guides/Configurator.md
  bridge:
