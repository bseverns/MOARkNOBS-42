      - firmware/README.md
      - docs/reference/ManifestContract.md
      - docs/reference/EEPROMLayout.md
  firmware_protocol:
    source:
      - firmware/include/protocol/**
      - firmware/src/protocol/**
    docs:
      - firmware/README.md
      - docs/reference/MN42LineProtocol.md
      - docs/reference/SerialProtocol.md
      - docs/reference/ManifestContract.md
