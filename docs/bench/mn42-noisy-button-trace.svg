<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">MN42 Noisy Button Trace Diagram</title>
  <desc id="desc">Annotated sketch showing button chatter on an oscilloscope and a contaminated ground joint.</desc>
  <rect width="960" height="600" fill="#101010"/>
  <rect x="40" y="40" width="880" height="520" fill="#171717" stroke="#f1f1f1" stroke-width="4"/>
  <text x="60" y="90" fill="#6fe7ff" font-family="'DejaVu Sans', Arial, sans-serif" font-size="36">Noisy Button — Chatter on the Rising Edge</text>
  <text x="60" y="140" fill="#e8e8e8" font-family="'DejaVu Sans', Arial, sans-serif" font-size="22">Scope channel 1 rides the raw switch, channel 2 watches the MCU GPIO.</text>
  <text x="60" y="172" fill="#e8e8e8" font-family="'DejaVu Sans', Arial, sans-serif" font-size="22">Every press jitters across the debounce window because ground is crusty.</text>
  <rect x="80" y="210" width="320" height="200" fill="#1f2337" stroke="#ff9f6f" stroke-width="4" rx="12"/>
  <text x="100" y="250" fill="#ff9f6f" font-family="'DejaVu Sans', Arial, sans-serif" font-size="20">Button node rockets between</text>
  <text x="100" y="280" fill="#ff9f6f" font-family="'DejaVu Sans', Arial, sans-serif" font-size="20">0 V and 3V3 for 1 ms.</text>
  <text x="100" y="310" fill="#ff9f6f" font-family="'DejaVu Sans', Arial, sans-serif" font-size="20">Hardware debounce cap MIA.</text>
  <rect x="440" y="210" width="440" height="200" fill="#1f2b24" stroke="#9fff6f" stroke-width="4" rx="12"/>
  <text x="460" y="250" fill="#9fff6f" font-family="'DejaVu Sans', Arial, sans-serif" font-size="20">GPIO trace copies the spikes.</text>
  <text x="460" y="280" fill="#9fff6f" font-family="'DejaVu Sans', Arial, sans-serif" font-size="20">Firmware sees eight presses.</text>
  <text x="460" y="310" fill="#9fff6f" font-family="'DejaVu Sans', Arial, sans-serif" font-size="20">Drop in a 100 nF cap + resolder.</text>
  <rect x="160" y="440" width="360" height="100" fill="#241f1f" stroke="#ff6fde" stroke-width="4" rx="12"/>
  <text x="180" y="480" fill="#ff6fde" font-family="'DejaVu Sans', Arial, sans-serif" font-size="20">Fluxy ground joint lifts the reference.</text>
  <text x="180" y="510" fill="#ff6fde" font-family="'DejaVu Sans', Arial, sans-serif" font-size="20">Scrub, reflow, rejoice.</text>
  <defs>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9f6f"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9fff6f"/>
    </marker>
    <marker id="arrow-pink" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6fde"/>
    </marker>
  </defs>
  <path d="M240 210 L240 180 L400 180" stroke="#ff9f6f" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M660 210 L660 160 L820 160" stroke="#9fff6f" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M340 440 L340 400 L520 400" stroke="#ff6fde" stroke-width="4" fill="none" marker-end="url(#arrow-pink)"/>
</svg>
