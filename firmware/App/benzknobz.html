<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benz EEPROM Settings Manager</title>
  <style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #111;
  color: #eee;
  margin: 20px;
}
h1, h2 {
  text-align: center;
  color: #00ffff;
}
#pot-controls {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}
.pot-row {
  background-color: #222;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
}
.pot-row label {
  font-weight: 600;
  margin-bottom: 4px;
}
.pot-row input, .pot-row select {
  background: #333;
  color: #eee;
  border: 1px solid #444;
  border-radius: 4px;
  width: 100%;
  padding: 4px;
}
button {
  background: #007BFF;
  border: none;
  color: white;
  padding: 10px 16px;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 20px;
}
button:hover {
  background: #0056b3;
}
#status {
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
  color: #ffcc00;
}
    #led-settings {
      margin-top: 20px;
      text-align: center;
    }
    #update-all {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #007BFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #update-all:hover {
      background-color: #0056b3;
    }
    #status {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
    #slots, #envelopes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
    }
    #slots progress, #envelopes progress {
      width: 40px;
    }
  </style>
  <script type="module">
  let port, reader, writer;
  const encoder = new TextEncoder();
  const lineQueue = [], lineWaiters = [];

  const statusEl = document.getElementById("status");
  const connectBtn = document.getElementById("connect");
  const saveBtn    = document.getElementById("save");
  const slotContainer = document.getElementById("slots");
  const envContainer  = document.getElementById("envelopes");
  const slotEls = Array.from({length:42}, () => {
    const p = document.createElement("progress");
    p.max = 127; p.value = 0; slotContainer.appendChild(p); return p;
  });
  const envEls = Array.from({length:6}, () => {
    const p = document.createElement("progress");
    p.max = 127; p.value = 0; envContainer.appendChild(p); return p;
  });

    async function connect() {
      try {
        statusEl.textContent = "🔌 Opening port…";
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 31250 });

        // set up text streams
        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();
        writer = port.writable.getWriter();

        statusEl.textContent = "Connected.";
        connectBtn.disabled = true;   // disable connect after success
        saveBtn.disabled    = false;  // allow saving now

        readLoop();
        await send("HELLO");
        const schema = await loadSchema();
        const config = await loadConfig();
        buildForm(schema, config);
      } catch (err) {
        console.error(err);
        statusEl.textContent = `Connection failed: ${err.message || err}`;
      }
    }

    function getLine() {
      return lineQueue.length ?
        Promise.resolve(lineQueue.shift()) :
        new Promise(res => lineWaiters.push(res));
    }

    async function send(cmd) {
      const packet = encoder.encode(cmd + "\n");
      await writer.write(packet);
      return await getLine();
    }

    async function readLoop() {
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line) continue;
          try {
            const msg = JSON.parse(line);
            if (msg.slots && msg.envelopes) {
              drawState(msg);
              continue;
            }
          } catch (e) {
            // not JSON, treat as raw line
          }
          if (lineWaiters.length) lineWaiters.shift()(line);
          else lineQueue.push(line);
        }
      }
    }

    function drawState(msg) {
      msg.slots.forEach((v,i)=> slotEls[i].value = v);
      msg.envelopes.forEach((v,i)=> envEls[i].value = v);
    }

    async function loadSchema() {
        try {
          statusEl.textContent = "Loading schema…";
          const raw = await send("GET_SCHEMA");
          statusEl.textContent = "Schema loaded.";
          return JSON.parse(raw);
        } catch (err) {
          statusEl.textContent = `Schema error: ${err.message || err}`;
          throw err;
        }
      }

      async function loadConfig() {
        try {
          statusEl.textContent = "Loading config…";
          const raw = await send("GET_ALL");
          statusEl.textContent = "Config loaded.";
          return JSON.parse(raw);
        } catch (err) {
          statusEl.textContent = `Config error: ${err.message || err}`;
          throw err;
        }
      }

function buildForm(schema, values) {
  const container = document.getElementById("form");
  container.innerHTML = "";
  for (const field of schema) {
    if (field.type === "group") {
      const groupEl = document.createElement("fieldset");
      groupEl.innerHTML = `<legend>${field.label}</legend>`;
      for (let i=0; i< (field.count||1); i++) {
        const sub = document.createElement("div");
        for (const f of field.fields) {
          const key = `${field.key}[${i}].${f.subkey}`;
          const val = values[field.key][i][f.subkey];
          sub.innerHTML += `
            <label>${f.label} ${i}:
              <input name="${key}" type="${f.type}"
                     value="${val}"
                     ${f.min?`min=${f.min}`:""} ${f.max?`max=${f.max}`:""}
                     ${f.step?`step=${f.step}`:""}>
            </label>
          `;
        }
        groupEl.appendChild(sub);
      }
      container.appendChild(groupEl);
    }
    else if (field.type === "select") {
      const sel = document.createElement("select");
      sel.name = field.key;
      for (const opt of field.options) {
        sel.innerHTML += `<option value="${opt}"
            ${values[field.key]===opt?"selected":""}>${opt}</option>`;
      }
      container.innerHTML += `<label>${field.label}</label>`;
      container.appendChild(sel);
    }
  }
}

async function saveConfig() {
  try {
    statusEl.textContent = "Saving…";
    const data = {};
    const form = document.querySelector("#form");
    new FormData(form).forEach((v,k) => {
      const m = k.match(/([^.]+)\[(\d+)\]\.(.+)/);
      if (m) {
        data[m[1]] = data[m[1]]||[];
        data[m[1]][+m[2]] = data[m[1]][+m[2]]||{};
        data[m[1]][+m[2]][m[3]] = isNaN(v)?v: +v;
      } else {
        data[k] = isNaN(v)?v: +v;
      }
    });
    await writer.write(encoder.encode("SET_ALL " + JSON.stringify(data) + "\n"));
    statusEl.textContent = "Save sent.";
  } catch (err) {
    console.error(err);
    statusEl.textContent = `Save failed: ${err.message || err}`;
  }
}

// wire it up
connectBtn.addEventListener("click", connect);
saveBtn.addEventListener("click", saveConfig);
</script>

</head>
<body>
  <h1>MOARkNOBZ Configurator</h1>
  <button id="connect">Connect</button>
  <div id="form"></div>
  <button id="save" disabled>Save</button>
  <div id="status"></div>
  <div id="live">
    <h2>Live Slots</h2>
    <div id="slots"></div>
    <h2>Envelope Levels</h2>
    <div id="envelopes"></div>
  </div>
</body>
</html>
