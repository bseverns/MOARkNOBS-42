<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benz EEPROM Settings Manager</title>
  <!--
    WebSerial refuses to jam from a file:// URL.
    Spin up a quick server:
      $ cd firmware/App
      $ python3 -m http.server
    Then point your browser at http://localhost:8000/benzknobz.html and rock on.
  -->
  <style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #111;
  color: #eee;
  margin: 20px;
}
h1, h2 {
  text-align: center;
  color: #00ffff;
}
#pot-controls {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}
.pot-row {
  background-color: #222;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
}
.pot-row label {
  font-weight: 600;
  margin-bottom: 4px;
}
.pot-row input, .pot-row select {
  background: #333;
  color: #eee;
  border: 1px solid #444;
  border-radius: 4px;
  width: 100%;
  padding: 4px;
}
button {
  background: #007BFF;
  border: none;
  color: white;
  padding: 10px 16px;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 20px;
}
button:hover {
  background: #0056b3;
}
#status {
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
  color: #ffcc00;
}

#main-layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}
#form {
  flex: 1;
}
#sidebar {
  flex: 0 0 250px;
}
@media (max-width: 600px) {
  #main-layout {
    flex-direction: column;
  }
  #sidebar {
    flex-basis: auto;
  }
}
    #led-settings {
      margin-top: 20px;
      text-align: center;
    }
    #update-all {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #007BFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #update-all:hover {
      background-color: #0056b3;
    }
    #status {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
    #slots, #envelopes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
    }
    #slots .meter, #envelopes .meter {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #slots progress, #envelopes progress {
      width: 40px;
    }
    #slots span, #envelopes span {
      font-size: 12px;
      margin-top: 2px;
    }
    .flash {
      animation: flash 0.2s linear;
    }
    .meter.active {
      animation: blip 0.3s linear;
    }
    @keyframes blip {
      from { background-color: #0ff; }
      to   { background-color: #222; }
    }
    @keyframes flash {
      from { transform: scale(1.3); }
      to   { transform: scale(1); }
    }
    #arg-method {
      text-align: center;
      margin-top: 8px;
      font-size: 14px;


    [data-tooltip] {
      position: relative;
      cursor: help;
    }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 100%;
      left: 0;
      background: #333;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 10;
      transform: translateY(4px);

    #log {
      background: #000;
      color: #0f0;
      padding: 8px;
      max-height: 200px;
      overflow-y: auto;

    }
  </style>
  <script type="module">
  let port, reader, writer;
  const encoder = new TextEncoder();
  const lineQueue = [], lineWaiters = [];

  const statusEl = document.getElementById("status");
  const connectBtn = document.getElementById("connect");
  const saveBtn    = document.getElementById("save");
  const slotContainer = document.getElementById("slots");
  const envContainer  = document.getElementById("envelopes");
  const argMethodEl   = document.getElementById("arg-method");
  const filterTypeEl  = document.getElementById("filter-type");
  const filterFreqEl  = document.getElementById("filter-freq");
  const filterQEl     = document.getElementById("filter-q");
  const argEnableEl   = document.getElementById("arg-enable");
  const argAEl        = document.getElementById("arg-a");
  const argBEl        = document.getElementById("arg-b");

  const logEl = document.getElementById("log");

  function setStatus(msg, isError = false) {
    statusEl.style.color = isError ? '#ff073a' : '#ffcc00';
    statusEl.textContent = msg;
  }

  // Show a nudge if we're loaded from disk and not over HTTP(S)
  if (location.protocol === 'file:') {
    setStatus('Serve this page with "python3 -m http.server" so WebSerial will cooperate.');
  }

  const slotEls = Array.from({length:42}, () => {
    const wrap = document.createElement("div");
    wrap.className = "meter";
    const p = document.createElement("progress");
    p.max = 127; p.value = 0;
    const s = document.createElement("span");
    s.textContent = "0";
    wrap.appendChild(p);
    wrap.appendChild(s);
    slotContainer.appendChild(wrap);
    return {p,s,wrap};
  });
  const envEls = Array.from({length:6}, () => {
    const wrap = document.createElement("div");
    wrap.className = "meter";
    const p = document.createElement("progress");
    p.max = 127; p.value = 0;
    const s = document.createElement("span");
    s.textContent = "0";
    wrap.appendChild(p);
    wrap.appendChild(s);
    envContainer.appendChild(wrap);
    return {p,s,wrap};
  });

    async function connect() {
      try {
        setStatus("🔌 Opening port…");
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 31250 });

        // set up text streams
        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();
        writer = port.writable.getWriter();

        setStatus("Connected.");
        connectBtn.disabled = true;   // disable connect after success
        saveBtn.disabled    = false;  // allow saving now

        readLoop();
        await send("HELLO");
        const schema = await loadSchema();
        const config = await loadConfig();
        buildForm(schema, config);
        await loadFilter();
        await loadARGPair();
      } catch (err) {
        console.error(err);
        setStatus(`Connection failed: ${err.message || err}`, true);
        throw err;
      }
    }

    function getLine() {
      return lineQueue.length ?
        Promise.resolve(lineQueue.shift()) :
        new Promise(res => lineWaiters.push(res));
    }

    async function send(cmd) {
      try {
        const packet = encoder.encode(cmd + "\n");
        await writer.write(packet);
        return await getLine();
      } catch (err) {
        console.error(err);
        setStatus(`Send fail: ${err.message || err}`, true);
        throw err;
      }
    }

    async function readLoop() {
      let buf = "";
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          let idx;
          while ((idx = buf.indexOf("\n")) >= 0) {
            const line = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if (!line) continue;
            if (logEl) logEl.textContent += line + "\n";
            try {
              const msg = JSON.parse(line);
              if (msg.slots && msg.envelopes) {
                drawState(msg);
                continue;
              }
            } catch (e) {
              // not JSON, treat as raw line
            }
            if (lineWaiters.length) lineWaiters.shift()(line);
            else lineQueue.push(line);
          }
        }
      } finally {
        port = null;
        setStatus("Port closed.", true);
        connectBtn.disabled = false;
        saveBtn.disabled = true;
      }
    }

    function drawState(msg) {
      msg.slots.forEach((v,i)=> {
        slotEls[i].p.value = v;
        slotEls[i].s.textContent = v;
        flash(slotEls[i].s);
      });
      msg.envelopes.forEach((v,i)=> {
        envEls[i].p.value = v;
        envEls[i].s.textContent = v;
        flash(envEls[i].s);
      });
      if (msg.currentSlot !== undefined) {
        slotEls.forEach((el,i)=> {
          if (i === msg.currentSlot) highlight(el.wrap);
        });
      }
      if (msg.efStatus) {
        msg.efStatus.forEach((on,i)=> {
          if (on) highlight(envEls[i].wrap);
        });
      }
      if (msg.argMethod !== undefined && argMethodEl) {
        argMethodEl.textContent = msg.argMethod;
      }
    }

    function flash(el) {
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    }

    function highlight(el) {
      el.classList.remove('active');
      void el.offsetWidth;
      el.classList.add('active');
    }

    async function loadSchema() {
        try {
          setStatus("Loading schema…");
          const raw = await send("GET_SCHEMA");
          setStatus("Schema loaded.");
          return JSON.parse(raw);
        } catch (err) {
          setStatus(`Schema error: ${err.message || err}`, true);
          throw err;
        }
      }

  async function loadConfig() {
        try {
          setStatus("Loading config…");
          const raw = await send("GET_ALL");
          setStatus("Config loaded.");
          return JSON.parse(raw);
        } catch (err) {
          setStatus(`Config error: ${err.message || err}`, true);
          throw err;
        }
      }

    async function loadFilter() {
      try {
        const raw = await send("GET_FILTER");
        const [type, freq, q] = raw.split(",");
        filterTypeEl.value = type;
        filterFreqEl.value = freq;
        filterQEl.value = q;
      } catch (err) {
        setStatus(`Filter load fail: ${err.message || err}`, true);
      }
    }

    async function loadARGPair() {
      try {
        const raw = await send("GET_ARGPAIR");
        const [en, a, b] = raw.split(",");
        argEnableEl.value = en;
        argAEl.value = a;
        argBEl.value = b;
      } catch (err) {
        setStatus(`ARG load fail: ${err.message || err}`, true);
      }
    }

function buildForm(schema, values) {
  const container = document.getElementById("form");
  container.innerHTML = "";
  const ledContainer = document.getElementById("led-settings");
  if (ledContainer) ledContainer.innerHTML = "<legend>LED Colors</legend>";
  for (const field of schema) {
    if (field.key === "ledColors") {
      const count = field.count || 0;
      for (let i = 0; i < count; i++) {
        const val = values[field.key]?.[i]?.color || "#000000";
        const inp = document.createElement("input");
        inp.type = "color";
        inp.name = `ledColors[${i}].color`;
        inp.value = val;
        const lab = document.createElement("label");
        lab.textContent = `LED ${i + 1}`;
        lab.appendChild(inp);
        ledContainer.appendChild(lab);
      }
      continue;
    }
    if (field.type === "group") {
      const groupEl = document.createElement("fieldset");
      groupEl.innerHTML = `<legend>${field.label}</legend>`;
      const count = field.count || 1;
      for (let i = 0; i < count; i++) {
        const sub = document.createElement("div");
        for (const f of field.fields) {
          const key = `${field.key}[${i}].${f.subkey}`;
          const val = values[field.key]?.[i]?.[f.subkey];
          const labelText = `${f.label}${count>1?` ${i}`:""}`;
          if (f.type === "select") {
            const sel = document.createElement("select");
            sel.name = key;
            for (const opt of f.options) {
              sel.innerHTML += `<option value="${opt}" ${val===opt?"selected":""}>${opt}</option>`;
            }
            const lab = document.createElement("label");
            lab.textContent = labelText;
            lab.appendChild(sel);
            sub.appendChild(lab);
          } else if (f.type === "boolean") {
            const inp = document.createElement("input");
            inp.type = "checkbox";
            inp.name = key;
            if (val) inp.checked = true;
            const lab = document.createElement("label");
            lab.textContent = labelText;
            lab.appendChild(inp);
            sub.appendChild(lab);
          } else {
            const inp = document.createElement("input");
            inp.type = f.type;
            inp.name = key;
            if (val !== undefined) inp.value = val;
            if (f.min !== undefined) inp.min = f.min;
            if (f.max !== undefined) inp.max = f.max;
            if (f.step !== undefined) inp.step = f.step;
            const lab = document.createElement("label");
            lab.textContent = labelText;
            lab.appendChild(inp);
            sub.appendChild(lab);
          }
        }
        groupEl.appendChild(sub);
      }
      container.appendChild(groupEl);
    } else if (field.type === "select") {
      const sel = document.createElement("select");
      sel.name = field.key;
      for (const opt of field.options) {
        sel.innerHTML += `<option value="${opt}" ${values[field.key]===opt?"selected":""}>${opt}</option>`;
      }
      const lab = document.createElement("label");
      lab.textContent = field.label;
      lab.appendChild(sel);
      container.appendChild(lab);
    } else if (field.type === "boolean") {
      const chk = document.createElement("input");
      chk.type = "checkbox";
      chk.name = field.key;
      if (values[field.key]) chk.checked = true;
      const lab = document.createElement("label");
      lab.textContent = field.label;
      lab.appendChild(chk);
      container.appendChild(lab);
    } else {
      const inp = document.createElement("input");
      inp.type = field.type;
      inp.name = field.key;
      if (values[field.key] !== undefined) inp.value = values[field.key];
      if (field.min !== undefined) inp.min = field.min;
      if (field.max !== undefined) inp.max = field.max;
      if (field.step !== undefined) inp.step = field.step;
      const lab = document.createElement("label");
      lab.textContent = field.label;
      lab.appendChild(inp);
      container.appendChild(lab);
    }
  }
}

async function saveConfig() {
  try {
    setStatus("Saving…");
    const data = {};
    const form = document.querySelector("#form");
    Array.from(form.elements).forEach(el => {
      if (!el.name) return;
      const raw = el.type === "checkbox" ? el.checked : el.value;
      const v = el.type === "checkbox" ? raw : (isNaN(raw) ? raw : +raw);
      const m = el.name.match(/([^.]+)\[(\d+)\]\.(.+)/);
      if (m) {
        const [_, group, idx, sub] = m;
        data[group] = data[group] || [];
        data[group][+idx] = data[group][+idx] || {};
        data[group][+idx][sub] = v;
      } else {
        data[el.name] = v;
      }
    });

    const ledInputs = document.querySelectorAll("#led-settings input[type='color']");
    if (ledInputs.length) {
      data.ledColors = Array.from(ledInputs).map(inp => ({ color: inp.value }));
    }

    await writer.write(encoder.encode("SET_ALL " + JSON.stringify(data) + "\n"));
    await send(`SET_FILTER ${filterTypeEl.value},${filterFreqEl.value},${filterQEl.value}`);
    await send(`SET_ARGPAIR ${argEnableEl.value},${argAEl.value},${argBEl.value}`);
    setStatus("Save sent.");
  } catch (err) {
    console.error(err);
    setStatus(`Save failed: ${err.message || err}`, true);
  }
}

// poll for a previously-granted port coming back from the void
setInterval(async () => {
  try {
    if (port) return;
    const ports = await navigator.serial.getPorts();
    if (ports.length) {
      setStatus('Device is back. Smash Connect?');
      if (confirm('Device is back. Connect now?')) {
        try { await connect(); } catch (_) { /* status already set */ }
      }
    }
  } catch (err) {
    console.error('reconnect poll', err);
  }
}, 5000);

// wire it up
connectBtn.addEventListener("click", async () => {
  try { await connect(); } catch (_) { /* status already set */ }
});
saveBtn.addEventListener("click", saveConfig);
</script>

</head>
<body>
  <h1>MOARkNOBZ Configurator</h1>
  <button id="connect">Connect</button>
  <div id="main-layout">
    <div id="sidebar">
      <fieldset id="filter-settings">
        <legend>Filter</legend>
        <label data-tooltip="Filter curve applied to pot motion. LINEAR keeps it straight, RANDOM goes rogue.">Type
          <select id="filter-type">
            <option value="0">LINEAR</option>
            <option value="1">OPPOSITE_LINEAR</option>
            <option value="2">EXPONENTIAL</option>
            <option value="3">RANDOM</option>
            <option value="4">LOWPASS</option>
            <option value="5">HIGHPASS</option>
            <option value="6">BANDPASS</option>
          </select>
        </label>
        <label data-tooltip="Cutoff frequency in Hz. 20–5000">Freq <input id="filter-freq" type="number" min="20" max="5000"></label>
        <label data-tooltip="Resonance. Higher Q = sharper bite">Q <input id="filter-q" type="number" min="0.5" max="4" step="0.01"></label>
      </fieldset>
      <fieldset id="arg-settings">
        <legend>ARG Pair</legend>
        <label data-tooltip="Envelope follower A gain">A <input id="arg-a" type="number" min="0" max="5"></label>
        <label data-tooltip="Envelope follower B gain">B <input id="arg-b" type="number" min="0" max="5"></label>
      </fieldset>
    </div>
    <div id="form"></div>
    <fieldset id="filter-settings">
      <legend>Filter</legend>
      <label data-tooltip="Filter curve applied to pot motion. LINEAR keeps it straight, RANDOM goes rogue.">Type
        <select id="filter-type">
          <option value="0">LINEAR</option>
          <option value="1">OPPOSITE_LINEAR</option>
          <option value="2">EXPONENTIAL</option>
          <option value="3">RANDOM</option>
          <option value="4">LOWPASS</option>
          <option value="5">HIGHPASS</option>
          <option value="6">BANDPASS</option>
        </select>
      </label>
      <label data-tooltip="Cutoff frequency in Hz. 20–5000">Freq <input id="filter-freq" type="number" min="20" max="5000"></label>
      <label data-tooltip="Resonance. Higher Q = sharper bite">Q <input id="filter-q" type="number" min="0.5" max="4" step="0.01"></label>
    </fieldset>
    <fieldset id="arg-settings">
      <legend>ARG Pair</legend>
      <label data-tooltip="ARG engine on or off?">Enable
        <select id="arg-enable">
          <option value="1">ON</option>
          <option value="0">OFF</option>
        </select>
      </label>
      <label data-tooltip="Envelope follower A gain">A <input id="arg-a" type="number" min="0" max="5"></label>
      <label data-tooltip="Envelope follower B gain">B <input id="arg-b" type="number" min="0" max="5"></label>
  </div>

  <button id="save" disabled>Save</button>

    <fieldset id="led-settings">
      <legend>LED Colors</legend>

    </fieldset>

    <button id="save" disabled>Save</button>
  <div id="status"></div>
  <details>
    <summary>Debug Log</summary>
    <pre id="log"></pre>
  </details>
  <div id="live">
    <h2>Live Slots</h2>
    <div id="slots"></div>
    <h2>Envelope Levels</h2>
    <div id="envelopes"></div>
    <h2>ARG Method</h2>
    <div id="arg-method"></div>
  </div>
</body>
</html>
