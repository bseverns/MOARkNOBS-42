[platformio]
default_envs = teensy40_main

; --- Shared base environment for Teensy 4.0 ---
[env:teensy40_base]
; Pin the CI-tested Teensy platform so clean runners and developer machines
; compile with the same framework and GCC warning set.
platform = teensy@5.2.0
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
board_build.usbtype = usb_midi_serial

lib_extra_dirs = lib, lib/teensy_patches  ; use vendored libs in firmware/lib and patched Teensy core bits

lib_deps =
    Bounce2
    TimerOne
    EEPROM
    bblanchon/ArduinoJson @ ^6.21.3
    fortyseveneffects/MIDI Library

lib_ignore = FastLED  ; choke off PlatformIO's copy and lean on our vendored FastLED

; FastLED, Adafruit SSD1306, and Adafruit GFX are vendored under lib/

build_flags =
    -I include                 ; surface shared headers for Unity and friends
    -Wall
    -Wextra
    -Wno-cast-function-type    ; Teensy core plays fast and loose with SysEx callbacks
    -Wno-unused-parameter      ; Teensy's Wire lib sometimes shrugs off args
    -Wno-error=unused-variable ;^^^
    -Wno-ignored-qualifiers    ; EEPROM API returns "const" like it means it
    -Wno-type-limits           ; Wire lib clamps uint8_t values past their range
    -Wno-sign-compare          ; Teensy core mixes signed/unsigned like it's 1999
    -Wno-lto-type-mismatch     ; Teensy USB string overrides use flexible-array descriptors
    -I lib/FastLEDConfig/src   ; pull in custom FastLED config
    -I src                     ; make sure project src/ is on the include path
    -I test                    ; put test stubs on the highway before vendor libs
    -DUSB_MIDI_SERIAL          ; force the core to cough up usbMIDI every time
    ;-DFASTLED_ALLOW_INTERRUPTS=0
    -DLED_DATA_PIN=6
    -DUSE_OCTOWS2811
    -DBUTTON_MANAGER_DEBUG=0 ; change to 1 for ButtonManager debug logs
    ; -DMN42_OLED_PARTIAL_UPDATES=0 ; force full-frame OLED transfers (A/B perf compare)
    ; -DCONFIG_STORAGE_LITTLEFS=1 ; opt-in: store ConfigManager payloads in LittleFS_Program
    ; -DMIDI_DEBUG        ; uncomment to spit MIDI logs over Serial
    !python3 -c "import os,pathlib,subprocess,sys; env=os.environ; root=pathlib.Path(env.get('PROJECT_DIR') or env.get('PROJECT_SRC_DIR') or env.get('PLATFORMIO_PROJECT_DIR') or env.get('PWD') or '.').resolve(); candidates=(root/'scripts'/'version.py', root/'firmware'/'scripts'/'version.py'); helper=next((p for p in candidates if p.exists()), None); sys.exit(subprocess.call([sys.executable, str(helper)])) if helper else sys.exit('version helper missing')" ; fall back through PROJECT_* vars/PWD so repo-root + firmware/ invocations both find version.py
build_src_flags =
    -Werror             ; treat warnings as errors in our own code

extra_scripts =
    pre:scripts/deprecated_copy_flag.py

; ─────────────────────────────────────────────────────────────────────
; Shared build_src_filter fragments
;
; PlatformIO lets sections inherit from each other via `extends` and
; interpolate values with `${section.key}`.  We define the shared
; module lists here once so individual envs just pick a test entry
; point and `${...}` the rest.
; ─────────────────────────────────────────────────────────────────────

; Core modules needed by every hardware/integration test.
; Individual test envs prepend their own entry-point file and append
; any extras (system_test shims, sys/report, etc.).
[core_modules]
build_src_filter =
    +<**/usb_identity.c>
    +<**/ButtonManager.cpp>
    +<**/WebSerial.cpp>
    +<**/ConfigManager.cpp>
    +<**/SchemaMigration.cpp>
    +<**/ProfileStorage.cpp>
    +<**/ARGMixer.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/PerlinNoise.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<**/ClockDiscipline.cpp>
    +<**/Hardware/IO.cpp>
    +<**/WebSerial.cpp>
    +<include/**.h>

; --- Main firmware build ---
; Run with: pio run -e teensy40_main
[main_firmware_build]
build_flags =
    ${env:teensy40_base.build_flags}
    -DCONFIG_STORAGE_LITTLEFS=1 ; production configuration requires the 16 KiB LittleFS store, not 1,080-byte emulated EEPROM
    -flto
    -fno-fat-lto-objects
build_src_filter =
    +<**/*.cpp>       ; scoop every core .cpp
    +<**/usb_identity.c> ; include USB string override C TU
    -<**/test_*.cpp>  ; but skip any test sketch
    -<**/*_t.cpp>
    +<include/**>

[env:teensy40_main]
extends = env:teensy40_base
build_flags =
    ${main_firmware_build.build_flags}
    -DMN42_BOARD_POWER_PROFILE=POWER_CHOKED_V1 ; current safe boundary for Rev A / unverified rails
    -DMN42_DISABLE_DISPLAY_BOOT_PROBE=1 ; keep default main boot stable when the OLED bus is absent/unvalidated
build_src_filter = ${main_firmware_build.build_src_filter}

; Bench-only EF sample-to-MIDI-enqueue timing. Serial records add measurable
; overhead, so never use this environment as a performance-production build.
[env:teensy40_ef_latency_bench]
extends = env:teensy40_base
build_flags =
    ${main_firmware_build.build_flags}
    -DMN42_BOARD_POWER_PROFILE=POWER_CHOKED_V1
    -DMN42_DISABLE_DISPLAY_BOOT_PROBE=1
    -DBENCH_EF_LATENCY_LOG=1
build_src_filter = ${main_firmware_build.build_src_filter}

; --- Main firmware build for validated split-rail rework boards ---
; Run with: pio run -e teensy40_main_reworked
[env:teensy40_main_reworked]
extends = env:teensy40_base
build_flags =
    ${main_firmware_build.build_flags}
    -DMN42_BOARD_POWER_PROFILE=SPLIT_RAIL_REWORK ; only for validated reworked / split-rail boards
build_src_filter = ${main_firmware_build.build_src_filter}

; --- Runtime bisect: keep protocol/runtime but suppress startup LED/OLED/UI lanes ---
