[platformio]
default_envs = teensy40_main

; --- Shared base environment for Teensy 4.0 ---
[env:teensy40_base]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

lib_extra_dirs = lib  ; use vendored libs in firmware/lib

lib_deps =
    Bounce2
    lathoub/USB-MIDI@^1.1.3
    TimerOne
    EEPROM
    bblanchon/ArduinoJson @ ^6.21.3

; FastLED, Adafruit SSD1306, and Adafruit GFX are vendored under lib/

lib_ignore =
    MIDI
    MIDIUSB

build_flags =
    -D USB_MIDI_SERIAL
    -D FASTLED_ALLOW_INTERRUPTS=0
    -D LED_DATA_PIN=6
    -D BUTTON_MANAGER_DEBUG=0 ; change to 1 for ButtonManager debug logs

; --- Main firmware build ---
; Run with: pio run -e teensy40_main
[env:teensy40_main]
extends = env:teensy40_base
build_src_filter =
    +<**/*.cpp>       ; scoop every core .cpp
    -<**/test_*.cpp>  ; but skip any test sketch
    +<include/**>

; --- Machine test sandbox ---
; Run with: pio run -e teensy40_machine_test --project-option="build_src_filter=+<../test/TestHelpers.cpp> +<**/test_main.cpp> +<**/*.cpp> -<**/test_*.cpp>"
[env:teensy40_machine_test]
extends = env:teensy40_base
build_src_filter =
    +<**/*.cpp>
    -<**/test_*.cpp>
    +<include/**>

; --- Unit tests (Unity) ---
; Run with: pio test -e teensy40_unit_tests
[env:teensy40_unit_tests]
extends = env:teensy40_base
build_src_filter =
    +<**/*.cpp>
    -<**/test_*.cpp>
    +<include/**>

; --- Full rig flasher: builds test_main.cpp for the whole hardware shebang ---
[env:teensy40_full_system]
extends = env:teensy40_base
build_src_filter =
    +<**/test_main.cpp>
    +<**/ButtonManager.cpp>
    +<**/ConfigManager.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<include/**.h>
    +<../test/TestHelpers.cpp>

; --- Unity test runner: taps tests/ for automated smoke checks ---
[env:teensy40_unity]
extends = env:teensy40_base
test_framework = unity
test_build_src = true
test_filter = test_*

; --- Unified hardware verification test ---
; Run with: pio run -e teensy40_unified_test
[env:teensy40_unified_test]
extends = env:teensy40_base
build_src_filter =
    +<**/test_Unified.cpp>
    +<**/ButtonManager.cpp>
    +<**/ConfigManager.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<include/**.h>
    +<../test/TestHelpers.cpp>

; --- Filter verification/calibration test ---
; Run with: pio run -e teensy40_biquad_test
[env:teensy40_biquad_test]
extends = env:teensy40_base
build_src_filter =
    +<**/test_biquadfilter.cpp>
    +<**/ButtonManager.cpp>
    +<**/ConfigManager.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<include/**.h>
    +<../test/TestHelpers.cpp>
    
; --- EEPROM persistence test ---
; Run with: pio run -e teensy40_eeprom_persistence
[env:teensy40_eeprom_persistence]
extends = env:teensy40_base
build_src_filter =
    +<**/test_eeprom_persistence.cpp>
    +<**/ButtonManager.cpp>
