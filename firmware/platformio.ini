[platformio]
default_envs = teensy40_main

; --- Shared base environment for Teensy 4.0 ---
[env:teensy40_base]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
board_build.usbtype = usb_midi_serial

lib_extra_dirs = lib, lib/teensy_patches  ; use vendored libs in firmware/lib and patched Teensy core bits

lib_deps =
    Bounce2
    TimerOne
    EEPROM
    bblanchon/ArduinoJson @ ^6.21.3
    fortyseveneffects/MIDI Library

lib_ignore = FastLED  ; choke off PlatformIO's copy and lean on our vendored FastLED

; FastLED, Adafruit SSD1306, and Adafruit GFX are vendored under lib/

build_flags =
    -I include                 ; surface shared headers for Unity and friends
    -Wall
    -Wextra
    -Wno-cast-function-type    ; Teensy core plays fast and loose with SysEx callbacks
    -Wno-unused-parameter      ; Teensy's Wire lib sometimes shrugs off args
    -Wno-error=unused-variable ;^^^
    -Wno-ignored-qualifiers    ; EEPROM API returns "const" like it means it
    -Wno-type-limits           ; Wire lib clamps uint8_t values past their range
    -Wno-sign-compare          ; Teensy core mixes signed/unsigned like it's 1999
    -Wno-lto-type-mismatch     ; Teensy USB string overrides use flexible-array descriptors
    -I lib/FastLEDConfig/src   ; pull in custom FastLED config
    -I src                     ; make sure project src/ is on the include path
    -I test                    ; put test stubs on the highway before vendor libs
    -DUSB_MIDI_SERIAL          ; force the core to cough up usbMIDI every time
    ;-DFASTLED_ALLOW_INTERRUPTS=0
    -DLED_DATA_PIN=6
    -DUSE_OCTOWS2811
    -DMN42_BOARD_POWER_PROFILE=POWER_CHOKED_V1 ; v1 board safety cap (~10% of 255)
    -DBUTTON_MANAGER_DEBUG=0 ; change to 1 for ButtonManager debug logs
    ; -DMN42_OLED_PARTIAL_UPDATES=0 ; force full-frame OLED transfers (A/B perf compare)
    ; -DCONFIG_STORAGE_LITTLEFS=1 ; opt-in: store ConfigManager payloads in LittleFS_Program
    ; -DMIDI_DEBUG        ; uncomment to spit MIDI logs over Serial
    !python3 -c "import os,pathlib,subprocess,sys; env=os.environ; root=pathlib.Path(env.get('PROJECT_DIR') or env.get('PROJECT_SRC_DIR') or env.get('PLATFORMIO_PROJECT_DIR') or env.get('PWD') or '.').resolve(); candidates=(root/'scripts'/'version.py', root/'firmware'/'scripts'/'version.py'); helper=next((p for p in candidates if p.exists()), None); sys.exit(subprocess.call([sys.executable, str(helper)])) if helper else sys.exit('version helper missing')" ; fall back through PROJECT_* vars/PWD so repo-root + firmware/ invocations both find version.py
build_src_flags =
    -Werror             ; treat warnings as errors in our own code

extra_scripts =
    pre:scripts/deprecated_copy_flag.py

; ─────────────────────────────────────────────────────────────────────
; Shared build_src_filter fragments
;
; PlatformIO lets sections inherit from each other via `extends` and
; interpolate values with `${section.key}`.  We define the shared
; module lists here once so individual envs just pick a test entry
; point and `${...}` the rest.
; ─────────────────────────────────────────────────────────────────────

; Core modules needed by every hardware/integration test.
; Individual test envs prepend their own entry-point file and append
; any extras (system_test shims, sys/report, etc.).
[core_modules]
build_src_filter =
    +<**/usb_identity.c>
    +<**/ButtonManager.cpp>
    +<**/WebSerial.cpp>
    +<**/ConfigManager.cpp>
    +<**/SchemaMigration.cpp>
    +<**/ProfileStorage.cpp>
    +<**/ARGMixer.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/PerlinNoise.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<**/ClockDiscipline.cpp>
    +<**/Hardware/IO.cpp>
    +<**/WebSerial.cpp>
    +<include/**.h>

; --- Main firmware build ---
; Run with: pio run -e teensy40_main
[env:teensy40_main]
extends = env:teensy40_base
build_flags =
    ${env:teensy40_base.build_flags}
    -flto
    -fno-fat-lto-objects
build_src_filter =
    +<**/*.cpp>       ; scoop every core .cpp
    +<**/usb_identity.c> ; include USB string override C TU
    -<**/test_*.cpp>  ; but skip any test sketch
    -<**/*_t.cpp>
    +<include/**>

; --- Full rig flasher: builds test_main.cpp for the whole hardware shebang ---
[env:teensy40_full_system]
extends = env:teensy40_base
build_flags =
    ${env:teensy40_base.build_flags}
    -DFULL_SYSTEM_COMBINED
    -DCONFIG_STORAGE_LITTLEFS=1
build_src_filter =
    +<**/main_t.cpp>
    ${core_modules.build_src_filter}
    +<**/SystemState.cpp>
    +<**/LedAnimator.cpp>
    +<**/LFO/LFO.cpp>
    +<**/LFO/LFOClock.cpp>
    +<**/LFO/LFOManager.cpp>
    +<../system_test/*.cpp>

; --- Unified hardware verification test ---
; Run with: pio run -e teensy40_unified_test
[env:teensy40_unified_test]
extends = env:teensy40_base
test_ignore = *
build_src_filter =
    +<**/unified_t.cpp>
    ${core_modules.build_src_filter}
    +<**/LFO/LFO.cpp>
    +<**/LFO/LFOClock.cpp>
    +<**/LFO/LFOManager.cpp>
    +<**/sys/report.cpp>
    +<../system_test/TestHelpers.cpp>

; --- USB/serial stability diagnostic ---
; Run with: pio run -e teensy40_usb_diag -t upload
; Uses the same usb_midi_serial mode as production, but avoids production runtime init.
[env:teensy40_usb_diag]
extends = env:teensy40_base
build_src_filter =
    +<**/usb_identity.c>
    +<**/usb_diag_t.cpp>

; --- USB-MIDI randomizer harnesses ---
; Run with: pio run -e teensy40_usb_midi_random_cc -t upload
[env:teensy40_usb_midi_random_cc]
extends = env:teensy40_base
build_src_filter =
    +<**/usb_identity.c>
    +<**/usb_midi_random_t.cpp>

; Run with: pio run -e teensy40_usb_midi_random_note -t upload
[env:teensy40_usb_midi_random_note]
extends = env:teensy40_base
build_flags =
    ${env:teensy40_base.build_flags}
    -DRANDOM_USB_MIDI_MODE_NOTE
build_src_filter =
    +<**/usb_identity.c>
    +<**/usb_midi_random_t.cpp>

; Run with: pio run -e teensy40_usb_midi_random_mixed -t upload
[env:teensy40_usb_midi_random_mixed]
extends = env:teensy40_base
build_flags =
    ${env:teensy40_base.build_flags}
    -DRANDOM_USB_MIDI_MODE_MIXED
build_src_filter =
    +<**/usb_identity.c>
    +<**/usb_midi_random_t.cpp>

; --- Filter verification/calibration test ---
; Run with: pio run -e teensy40_biquad_test
[env:teensy40_biquad_test]
extends = env:teensy40_base
build_src_filter =
    +<**/biquadfilter_t.cpp>
    ${core_modules.build_src_filter}
    +<../system_test/TestHelpers.cpp>
    
; --- EEPROM persistence test ---
; Run with: pio run -e teensy40_eeprom_persistence
[env:teensy40_eeprom_persistence]
extends = env:teensy40_base
build_flags =
    ${env:teensy40_base.build_flags}
    -DCONFIG_STORAGE_LITTLEFS=1
build_src_filter =
    +<**/eeprom_persistence_t.cpp>
    ${core_modules.build_src_filter}
    +<../system_test/TestHelpers.cpp>

; --- MIDISlot EEPROM verification ---
; Run with: pio run -e teensy40_slot_verify
[env:teensy40_slot_verify]
extends = env:teensy40_base
build_flags =
    ${env:teensy40_base.build_flags}
    -DCONFIG_STORAGE_LITTLEFS=1
build_src_filter =
    +<**/usb_identity.c>
    +<**/verify_slots_t.cpp>
    +<**/ConfigManager.cpp>
    +<**/SchemaMigration.cpp>
    +<**/ProfileStorage.cpp>
    +<**/ARGMixer.cpp>
    +<**/ClockDiscipline.cpp>
    +<**/Hardware/IO.cpp>
    +<include/**.h>
    +<../system_test/TestHelpers.cpp>

; --- 1-button / 1-envelope USB MIDI hardware demo ---
; Run with: pio run -e teensy40_button_ef_demo -t upload
[env:teensy40_button_ef_demo]
extends = env:teensy40_base
build_src_filter =
    +<**/usb_identity.c>
    +<../test/demo_button_ef_usb_midi.cpp>
    +<**/Hardware/IO.cpp>
    +<**/ARGMixer.cpp>
    +<**/ClockDiscipline.cpp>
    +<include/**.h>

; --- OLED + LED hardware exerciser ---
; Run with: pio run -e teensy40_display_led_hw -t upload
[env:teensy40_display_led_hw]
extends = env:teensy40_base
build_src_filter =
    +<**/usb_identity.c>
    +<**/display_led_hw_t.cpp>
    +<**/LEDManager.cpp>
    +<**/Globals.cpp>
    +<include/**.h>

; --- LED surface stress harness ---
; Run with: pio run -e teensy40_led_demo -t upload
[env:teensy40_led_demo]
extends = env:teensy40_base
build_src_filter =
    +<**/usb_identity.c>
    +<**/led_demo_t.cpp>
    +<**/LEDManager.cpp>
    +<**/LedAnimator.cpp>
    +<**/Globals.cpp>
    +<**/Utility.cpp>
    +<**/ClockDiscipline.cpp>
    +<**/Hardware/IO.cpp>
    +<**/sys/report.cpp>
    +<include/**.h>

; --- Power / thermal LED burn-in bench harness ---
; Run with: pio run -e teensy40_power_burnin -t upload
[env:teensy40_power_burnin]
extends = env:teensy40_base
build_src_filter =
    +<**/usb_identity.c>
    +<**/power_burnin_t.cpp>
    +<**/LEDManager.cpp>
    +<**/Globals.cpp>
    +<**/Utility.cpp>
    +<**/Hardware/IO.cpp>
    +<**/sys/report.cpp>
    +<include/**.h>

; --- Unity test runner: taps tests/ for automated smoke checks ---
[env:teensy40_unity]
extends = env:teensy40_base
test_framework = custom
test_ignore = ../system_test
extra_scripts =
  pre:scripts/deprecated_copy_flag.py
  pre:scripts/require_unity_test_target.py

board_build.usbtype = usb_midi_serial   ; CDC + usbMIDI (nice to have even with custom transport)
monitor_speed = 115200
test_build_src = true
test_filter = test_*

; Only compile what the unit tests need; keep hardware-heavy modules out
build_src_filter =
  +<**/Arpeggiator.cpp>
  +<**/MIDIHandler.cpp>
  +<**/ARGMixer.cpp>
  +<**/Utility.cpp>
  +<**/ConfigManager.cpp>
  +<**/SchemaMigration.cpp>
  +<**/ProfileStorage.cpp>
  +<**/PotentiometerManager.cpp>
  +<**/EnvelopeFollower.cpp>
  +<**/LFO/*.cpp>
  +<**/SysExTemplate.cpp>
  +<**/LEDManager.cpp>
  +<**/LedAnimator.cpp>
  +<**/ButtonManager.cpp>
  +<**/Runtime.cpp>
  +<**/Scheduler.cpp>
  +<**/WebSerial.cpp>
  +<**/sys/report.cpp>
  +<**/Hardware/IO.cpp>
  +<**/ClockDiscipline.cpp>
  +<**/BootMode.cpp>
  +<**/CommandQueue.cpp>
  +<**/protocol/*.cpp>
  +<**/interop/SeedBoxLink.cpp>
  +<**/SystemState.cpp>
  +<**/modes/Modes.cpp>
  +<**/ui/UI.cpp>
  -<**/Globals.cpp>            ; pulls SD/SdFat → &Serial in headers
  -<**/firmware_main.cpp>

; Don't let the linker drag in display/SD stacks for unit tests
lib_ignore =
  MIDI Library
  SD
  SdFat
  FastLED

; Unity ships with PlatformIO, but the latest CLI doesn't hand it over when we roll
; our own test runner. Pull in the upstream package explicitly; our config override
; still lives in lib/unity.
lib_deps =
  Bounce2
  TimerOne
  Adafruit GFX Library
  Adafruit SSD1306
  bblanchon/ArduinoJson @ ^6.21.3
  throwtheswitch/Unity @ ^2.5.2

build_flags =
  -I include
  !python3 -c "import os,pathlib,sys; root=pathlib.Path(os.environ.get('PROJECT_DIR') or os.environ.get('PLATFORMIO_PROJECT_DIR') or os.environ.get('PWD') or '.').resolve(); candidates=[root/'test'/'serial_shim.h', root/'firmware'/'test'/'serial_shim.h']; header=next((p for p in candidates if p.exists()), None); sys.exit('serial_shim.h missing for Unity shim include') if header is None else print(f'-include {header}')"
  ${env:teensy40_base.build_flags}
  -DUNIT_TEST
  -Wno-error=unused-variable
  -DUNITY_INCLUDE_CONFIG_H
  -DUSB_MIDI_STUB
  -Dusb_midi_class=teensy_core_usb_midi_class
  -DusbMIDI=teensy_core_usbMIDI
  -DUNIT_TEST_PROTOCOL_IMPL
  -DUNIT_TEST_INTEROP_IMPL
  
