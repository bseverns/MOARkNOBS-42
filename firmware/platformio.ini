[platformio]
default_envs = teensy40_main

; --- Shared base environment for Teensy 4.0 ---
[env:teensy40_base]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

lib_extra_dirs = lib, lib/teensy_patches  ; use vendored libs in firmware/lib and patched Teensy core bits

lib_deps =
    Bounce2
    lathoub/USB-MIDI@^1.1.3
    TimerOne
    EEPROM
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit BusIO
    fortyseveneffects/MIDI Library

; FastLED, Adafruit SSD1306, and Adafruit GFX are vendored under lib/

lib_ignore =
    MIDIUSB

build_flags =
    -Wall
    -Wextra
    -Wno-cast-function-type    ; upstream USB-MIDI lib is loose with function pointers
    -Wno-unused-parameter      ; Teensy's Wire lib sometimes shrugs off args
    -Wno-ignored-qualifiers    ; EEPROM API returns "const" like it means it
    -Wno-type-limits           ; Wire lib clamps uint8_t values past their range
    -I lib/FastLEDConfig/src   ; pull in custom FastLED config
    -I src                     ; make sure project src/ is on the include path
    -I include                 ; surface shared headers for Unity and friends
    -D USB_MIDI_SERIAL
    -D FASTLED_ALLOW_INTERRUPTS=0
    -D LED_DATA_PIN=6
    -D BUTTON_MANAGER_DEBUG=0 ; change to 1 for ButtonManager debug logs
    ; -D MIDI_DEBUG        ; uncomment to spit MIDI logs over Serial

build_src_flags =
    -Werror             ; treat warnings as errors in our own code

extra_scripts =
    pre:scripts/deprecated_copy_flag.py

; --- Main firmware build ---
; Run with: pio run -e teensy40_main
[env:teensy40_main]
extends = env:teensy40_base
build_src_filter =
    +<**/*.cpp>       ; scoop every core .cpp
    -<**/test_*.cpp>  ; but skip any test sketch
    +<include/**>

; --- Unit tests (Unity) ---
; Run with: pio test -e teensy40_unit_tests
[env:teensy40_unit_tests]
extends = env:teensy40_base
build_src_filter =
    +<**/*.cpp>
    -<**/test_*.cpp>
    +<include/**>

; --- Full rig flasher: builds test_main.cpp for the whole hardware shebang ---
[env:teensy40_full_system]
extends = env:teensy40_base
build_src_filter =
    +<**/test_main.cpp>
    +<**/ButtonManager.cpp>
    +<**/ConfigManager.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<**/unity_output.cpp>
    +<include/**.h>
    +<../test/TestHelpers.cpp>

; --- Unified hardware verification test ---
; Run with: pio run -e teensy40_unified_test
[env:teensy40_unified_test]
extends = env:teensy40_base
test_ignore = *
build_src_filter =
    +<**/test_Unified.cpp>
    +<**/ButtonManager.cpp>
    +<**/ConfigManager.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<**/unity_output.cpp>
    +<include/**.h>
    +<../test/TestHelpers.cpp>

; --- Filter verification/calibration test ---
; Run with: pio run -e teensy40_biquad_test
[env:teensy40_biquad_test]
extends = env:teensy40_base
build_src_filter =
    +<**/test_biquadfilter.cpp>
    +<**/ButtonManager.cpp>
    +<**/ConfigManager.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<**/unity_output.cpp>
    +<include/**.h>
    +<../test/TestHelpers.cpp>
    
; --- EEPROM persistence test ---
; Run with: pio run -e teensy40_eeprom_persistence
[env:teensy40_eeprom_persistence]
extends = env:teensy40_base
build_src_filter =
    +<**/test_eeprom_persistence.cpp>
    +<**/ButtonManager.cpp>
    +<**/ConfigManager.cpp>
    +<**/DisplayManager.cpp>
    +<**/EnvelopeFollower.cpp>
    +<**/Globals.cpp>
    +<**/LEDManager.cpp>
    +<**/Arpeggiator.cpp>
    +<**/MIDIHandler.cpp>
    +<**/PotentiometerManager.cpp>
    +<**/Utility.cpp>
    +<**/unity_output.cpp>
    +<include/**.h>
    +<../test/TestHelpers.cpp>

; --- MIDISlot EEPROM verification ---
; Run with: pio run -e teensy40_slot_verify
[env:teensy40_slot_verify]
extends = env:teensy40_base
build_src_filter =
    +<**/test_verify_slots.cpp>
    +<**/ConfigManager.cpp>
    +<**/unity_output.cpp>
    +<include/**.h>
    +<../test/TestHelpers.cpp>

; --- Unity test runner: taps tests/ for automated smoke checks ---
[env:teensy40_unity]
extends = env:teensy40_base
test_framework = unity
test_build_src = true
test_filter = test_*
build_src_filter =
    +<**/*.cpp>
    -<**/test_*.cpp>
    +<include/**>
    +<../test/TestHelpers.cpp>
lib_deps =
    ${env:teensy40_base.lib_deps}
    unity           ; keep <unity.h> on the path so pio run -e teensy40_unity doesn't bomb
lib_ignore =
    ${env:teensy40_base.lib_ignore}
    lathoub/USB-MIDI
    "fortyseveneffects/MIDI Library"
build_flags =
    ${env:teensy40_base.build_flags}
    -DUNIT_TEST
    -D UNITY_INCLUDE_CONFIG_H
    -DUSB_MIDI_STUB
 